<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birth Day</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="世界のどこかに生まれ、1歳ずつ歳を重ねていく人生シミュレーションゲーム。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- スタート画面 -->
  <section id="start" class="start">
    <div class="start-inner">
      <div class="cake-hero" aria-hidden="true">
        <div class="candles"><i></i><i></i><i></i></div>
        <div class="cake-top"></div>
        <div class="cake-body"></div>
      </div>
      <h1 class="logo">Happy <span>Birth</span> Day</h1>
      <p class="lead">世界のどこかに、もう一度生まれてみる。<br>1歳ずつ歳を重ねる、30分の人生シミュレーション。</p>
      <div class="start-btns">
        <button id="btn-born" class="btn primary big" type="button">🎂 生まれる</button>
        <button id="btn-continue" class="btn ghost" type="button" hidden>▶ 続きから</button>
        <button id="btn-custom" class="btn link" type="button">⚙️ 生まれる国や名前を選ぶ</button>
      </div>
      <form id="custom" class="custom" hidden>
        <label>生まれる国<select id="sel-country"></select></label>
        <label>性別<select id="sel-gender"><option value="">🎲 ランダム</option><option value="f">女の子</option><option value="m">男の子</option></select></label>
        <label>生まれの階級<select id="sel-class"><option value="">🎲 ランダム（国の豊かさで変わる）</option><option value="1">⭐ 極貧</option><option value="2">⭐⭐ 低所得</option><option value="3">⭐⭐⭐ 中流</option><option value="4">⭐⭐⭐⭐ 富裕層</option><option value="5">⭐⭐⭐⭐⭐ 特権階級</option></select></label>
        <label>名前（空欄ならその国らしい名前に）<input id="in-name" maxlength="12" placeholder="例：めりあ" autocomplete="off"></label>
        <button class="btn primary" type="submit">この設定で生まれる</button>
      </form>
      <ul class="points">
        <li><b>毎年</b>　行動・性格・趣味を1つずつ選ぶ</li>
        <li><b>進路</b>　幼稚園から大学院、就職、留学まで</li>
        <li><b>家族</b>　親・配偶者・子ども・孫まで見守る</li>
        <li><b>最後に</b>　人生のハイライトを画像で保存</li>
      </ul>
    </div>
  </section>

  <!-- ゲーム画面 -->
  <div id="app" hidden>
    <header class="topbar">
      <button id="btn-home" class="logo-s" type="button">Happy <span>Birth</span> Day</button>
      <div class="topbar-r">
        <div id="age-badge" class="age-badge" aria-live="polite"></div>
        <button id="btn-help" class="icon-btn" type="button" aria-label="遊び方">？</button>
      </div>
    </header>

    <div class="layout">
      <aside class="side">
        <section id="profile" class="panel profile"></section>
        <section class="panel">
          <h2 class="panel-h">ステータス</h2>
          <div id="stats" class="stats"></div>
        </section>
      </aside>

      <main class="main">
        <nav class="tabs" role="tablist">
          <button type="button" data-tab="year">📖 今年</button>
          <button type="button" data-tab="life">🧭 人生の選択</button>
          <button type="button" data-tab="fam">👪 家族</button>
          <button type="button" data-tab="me">🧬 わたし</button>
          <button type="button" data-tab="log">📜 年表</button>
        </nav>
        <div id="tab-year" class="tab-body"></div>
        <div id="tab-life" class="tab-body" hidden></div>
        <div id="tab-fam" class="tab-body" hidden></div>
        <div id="tab-me" class="tab-body" hidden></div>
        <div id="tab-log" class="tab-body" hidden></div>
      </main>
    </div>

    <footer class="bottombar">
      <div id="todo" class="todo"></div>
      <div class="bb-btns">
        <button id="btn-auto" class="btn ghost" type="button" title="残りの選択をおまかせで決める">🎲 おまかせ</button>
        <button id="btn-next" class="btn primary next" type="button">🎂 次の誕生日へ</button>
      </div>
    </footer>
  </div>

  <!-- エンディング -->
  <section id="ending" class="ending" hidden></section>

  <!-- ダイアログ -->
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="sheet"><div id="modal-body"></div></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/data/countries.js"></script>
  <script src="js/data/content.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
